# Based on ctotone/evil-coc7-card/.github/workflows/foundry-catalog-release.yml
# Run manually, after the corresponding GitHub Release has been created.
name: Foundry Catalog Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version déjà publiée dans GitHub Releases (ex: 1.0.0)"
        required: true
        type: string
      mode:
        description: "Validation seulement ou publication Foundry"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - publish

permissions:
  contents: read

jobs:
  register-foundry-release:
    runs-on: ubuntu-latest

    steps:
      - name: Vérifier les assets GitHub de la release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version invalide : ${VERSION}. Utiliser par exemple 1.0.0."
            exit 1
          fi
          base="https://github.com/ctotone/evil-messenger/releases/download/${VERSION}"
          curl --fail --location --silent --show-error --head "${base}/module.json"
          curl --fail --location --silent --show-error --head "${base}/evil-messenger.zip"

      - name: Enregistrer la version dans le catalogue Foundry
        env:
          VERSION: ${{ inputs.version }}
          MODE: ${{ inputs.mode }}
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${FOUNDRY_RELEASE_TOKEN:-}" ]; then
            echo "Secret FOUNDRY_RELEASE_TOKEN absent."
            exit 1
          fi

          if [ "${MODE}" = "dry-run" ]; then
            dry_run=true
          elif [ "${MODE}" = "publish" ]; then
            dry_run=false
          else
            echo "Mode invalide : ${MODE}"
            exit 1
          fi

          manifest="https://github.com/ctotone/evil-messenger/releases/download/${VERSION}/module.json"
          notes="https://github.com/ctotone/evil-messenger/releases/tag/${VERSION}"

          payload=$(cat <<JSON
          {
            "id": "evil-messenger",
            "dry-run": ${dry_run},
            "release": {
              "version": "${VERSION}",
              "manifest": "${manifest}",
              "notes": "${notes}",
              "compatibility": {
                "minimum": "14",
                "verified": "14"
              }
            }
          }
          JSON
          )

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: ${FOUNDRY_RELEASE_TOKEN}" \
            --data "${payload}" \
            "https://foundryvtt.com/_api/packages/release_version/"
